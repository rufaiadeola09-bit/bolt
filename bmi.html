<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<link rel="stylesheet" href="./bmi.css">
</head>
<body>
<div class="card">
    <h2>Calculate your BMI</h2>
    <div class="input-group">
        <label>WEIGHT:
            <span class="value" id="weightValue">78</span> kg
        </label>
        <input type="range" id="weight" onchange="updateWeight()" min="20" max="200" value="78">
    </div>
    <div class="input-group">
        <label>HEIGHT:
            <span class="value" id="heightValue">166</span> cm
        </label>
        <input type="range" onchange="updateHeight()" id="height" min="120" max="220" value="166">
    </div>
    <button onclick="calculateBMI()">CALCULATE</button>

    <div class="result">
        Your BMI: <span id="bmiResult">0</span>
    </div>

    <div id="advice"></div>
</div>

<script>
    function updateHeight(){
        document.getElementById("heightValue").innerHTML = document.getElementById("height").value; 
    }
    function updateWeight(){
        document.getElementById("weightValue").innerHTML = document.getElementById("weight").value; 
    }
    function calculateBMI(){
        let weight = document.getElementById("weight").value;
        
        let height = document.getElementById("height").value / 100;

        let bmi = weight / (height * height);

        document.getElementById("bmiResult").innerHTML = bmi;

        let advice = "";

        if(bmi < 20.5){
            advice = "Underweight";
        }
        else if(bmi < 30){
            advice = "Normal weight";
        }
        else if(bmi < 40){
            advice = "Overweight";
        }
        else{
            advice = "Obese";
        }

        document.getElementById("advice").textContent = advice;
    }
</script>
</body>
</html>
