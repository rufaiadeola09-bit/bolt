<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>

    <script src="https://cdn.tailwindcss.com"></script> 
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white shadow-lg rounded-xl p-8 w-96">
        <h1 class="text-3xl font-bold text-center mb-6">Calculate Your BMI</h1>
        <div class="space-y-5">
            <div>
                <label class="block font-semibold mb-2">Weight (kg):
                </label>
                <input  type="number"id="weight"value="78"class="w-full border rounded-lg p-3">
            </div>
            <div>
                <label class="block font-semibold mb-2">
                    Height (cm):
                </label>
                <input type="number" id="height"value="170"class="w-full border rounded-lg p-3">
            </div>
            <button onclick="calculateBMI()"class="w-full bg-blue-500 text-white py-3 rounded-lg hover:bg-blue-600">Calculate</button>
            <h2 class="text-xl font-bold text-center"> Your BMI:
                <span id="result">0</span>
            </h2>

        </div>

    </div>


<script>

function calculateBMI(){

    let weight =document.getElementById("weight").value

    let height = document.getElementById("height").value

    height = height / 100;


    let BMI = weight / (height * height);


    document.getElementById("result").innerHTML = BMI;

}

</script>

</body>
</html>
