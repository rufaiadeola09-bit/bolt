<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="flex flex-row">
        <div class="w-1/2 bg-cover">
            <img src="./sign-in.webp"  alt="">
        </div>
        <div class="w-1/2">
            <img src="./logo.webp" class="w-20 mx-auto mt-20" alt="">
            <p class="text-black font-bold text-2xl text-center">Welcome Back!</p>
            <form action="" class="flex flex-col">
                <input type="text" placeholder="Email" class="w-130 h-15 p-3 border-1 border-gray-400 ml-20 mt-5  ">
                <input type="password" placeholder="Password" class="w-130 h-15 p-3 border-1 border-gray-400 ml-20 mt-5  ">
                <button class="bg-red-600 mt-5 w-128 text-white p-3 h-15 mx-auto">Login</button>
                <a href="" class="text-red-600 ml-20">Forgot Password?</a>
                <button class="bg-white mt-5 w-128 text-black font-bold p-3 h-15 mx-auto border-1 border-gray-400 flex"><img src="./image-7@2x.webp" class="w-5 h-5 ml-30 mt-0" alt="">Continue With Google</button>
                <div class="ml-20">Don't have an account?  <span><a href="" class="text-red-600">Create Account</a></span></div>
                <a href="" class="mx-auto flex"><img src="./arrow-back1.svg" alt=""> <span class="text-gray-400">Back to Home</span></a>
            </form>
        </div>
    </div>
</body>
</html>
